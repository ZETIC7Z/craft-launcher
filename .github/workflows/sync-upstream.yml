name: Sync Upstream

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with upstream storytold/craft-launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "ZeticuzBot"
          git config user.email "bot@zeticuz.xyz"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/storytold/craft-launcher.git || true
          git fetch upstream main

      - name: Merge Upstream Changes
        run: |
          git checkout main
          git merge upstream/main -m "chore(sync): automated merge from upstream storytold/craft-launcher [skip ci]" || git merge --abort
          git push origin main || echo "No changes or push failed"
