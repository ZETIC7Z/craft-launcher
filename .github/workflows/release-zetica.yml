name: Build & Release Zetica Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.10.0)'
        required: true
        default: 'v0.10.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p artcraft-launcher

      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package Windows Artifacts (MSI & ZIP)
        shell: pwsh
        run: |
          $env:DIST = 'dist/release'
          pwsh packaging/windows/package.ps1 -Arch x64 -SkipBuild
          Copy-Item dist/release/*-windows-x64.msi dist/release/zetica-hub-windows-x64.msi -Force
          Copy-Item dist/release/*-windows-x64-portable.zip dist/release/zetica-hub-windows-x64.zip -Force
          Copy-Item dist/release/zetica-hub-windows-x64.msi dist/release/artcraft-launcher-windows-x64.msi -Force
          Copy-Item dist/release/zetica-hub-windows-x64.zip dist/release/artcraft-launcher-windows-x64-portable.zip -Force
          Get-ChildItem dist/release

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetica-hub-windows-x64-msi
          path: dist/release/*.msi

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetica-hub-windows-x64-zip
          path: dist/release/*.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: zetica-hub-windows-x64-msi
          path: artifacts-msi

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: zetica-hub-windows-x64-zip
          path: artifacts-zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Zetica Hub ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Zetica Hub Release ${{ github.event.inputs.tag_name || github.ref_name }}
            
            Official native installer and hub for the ZETICA Creative Suite.
            
            ### Included Packages:
            - `zetica-hub-windows-x64.msi`: Official Windows MSI Installer with custom folder selector and desktop shortcut option.
            - `zetica-hub-windows-x64.zip`: Standalone portable binary for Windows 64-bit.
            
            Developed by **Sam Pangilinan** ([zeticuz.xyz](https://www.zeticuz.xyz/)).
          files: |
            artifacts-msi/*
            artifacts-zip/*
          draft: false
          prerelease: false
